OniRunAnimSpeed=450.0

[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Development
; The oni look is only referenced by path (above), so the cooker would skip it: always cook the folder.
; If the folder is missing on a PC, the packaged game uses the placeholder cylinder.
+DirectoriesToAlwaysCook=(Path="/Game/CuteCreature")
; Mansion furniture: Fab "Stylized Library" (Content/Stylized_Library, not in Git either). Paths are in Data/Furniture.csv.
+DirectoriesToAlwaysCook=(Path="/Game/Stylized_Library")

