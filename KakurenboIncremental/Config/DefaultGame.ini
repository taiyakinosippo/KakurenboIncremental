OniAccessoryMesh=/Game/CuteCreature/Mesh/SK_Bandage.SK_Bandage
OniAnimIdle=/Game/CuteCreature/Animations/Anim_Idle.Anim_Idle
OniAnimRun=/Game/CuteCreature/Animations/Anim_Run.Anim_Run
OniAnimAttack=/Game/CuteCreature/Animations/Anim_Attack.Anim_Attack
