<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- アイコン案 C：館の壁のかげから、目のある小判がのぞく（稼ぐ＋かくれんぼ）。400×400、X は丸く切り抜く -->
<style>
  body { width: 400px; height: 400px; position: relative; }
  .sky { background: radial-gradient(circle at 34% 40%, #6a4fc0 0%, #3a2a7a 30%, #1c1442 62%, #0b0820 100%); }
  .halo { position: absolute; left: 40px; top: 60px; width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 220, 120, .45) 0%, rgba(255, 200, 90, .12) 45%, transparent 70%); }

  /* 大きな小判。少し傾けて、壁から身を乗り出す */
  .bigkoban { position: absolute; left: 92px; top: 74px; width: 176px; height: 250px; border-radius: 50%; transform: rotate(-10deg);
    background: radial-gradient(ellipse at 36% 26%, #fffbe6 0%, #ffe07a 26%, #ffbf3a 56%, #e88a1c 82%, #b85f0c 100%);
    border: 12px solid #1a0a2c; box-shadow: inset 0 0 0 6px #fff1b0, inset -14px -18px 0 4px rgba(170, 80, 0, .35), 0 12px 0 #0b0414; }
  /* 口（「しーっ」とすぼめた口） */
  .bigkoban::before { content: ""; position: absolute; left: 66px; top: 150px; width: 22px; height: 26px; border-radius: 50%;
    background: #6a2a10; border: 6px solid #1a0a2c; }
  /* 目（ロゴの「ぼ」の濁点と同じ形） */
  .bigkoban .eye { width: 50px; height: 62px; border-width: 8px; box-shadow: 0 5px 0 rgba(11, 4, 20, .6); }
  .bigkoban .eye::after { left: 4%; top: 30%; width: 56%; height: 52%; box-shadow: inset 6px 6px 0 -2px #fff; }
  .bigkoban .l { left: 18px; top: 52px; transform: rotate(-4deg); }
  .bigkoban .r { left: 74px; top: 44px; transform: rotate(6deg); }
  /* ほっぺ */
  .bigkoban .cheek { position: absolute; width: 26px; height: 14px; border-radius: 50%; background: rgba(255, 110, 90, .55); top: 124px; }

  /* 館の壁（ゲームと同じ：上はラベンダー、横は緑がかった壁紙） */
  .wall { position: absolute; left: 236px; top: 20px; width: 200px; height: 420px; }
  .wall .cap { position: absolute; left: -14px; top: 0; width: 230px; height: 46px; border-radius: 10px;
    background: linear-gradient(180deg, #d6c2ff, #a98ae6); border: 9px solid #1a0a2c; box-shadow: 0 8px 0 rgba(11, 4, 20, .5); z-index: 2; }
  .wall .side { position: absolute; left: 0; top: 30px; width: 200px; height: 400px;
    background:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, .05) 0 6px, transparent 6px 22px),
      linear-gradient(180deg, #3f7a72 0%, #2c5b58 55%, #1f3f44 100%);
    border: 9px solid #1a0a2c; border-top: none; }
  /* 腰壁（木） */
  .wall .side::after { content: ""; position: absolute; left: 0; right: 0; top: 230px; bottom: 0;
    background: linear-gradient(180deg, #7a3e22, #4f2614); border-top: 8px solid #1a0a2c; }
  /* 小判をつかむ手（壁のふちにかけた指） */
  .finger { position: absolute; width: 26px; height: 18px; border-radius: 9px; background: #ffd25c; border: 6px solid #1a0a2c; z-index: 3; }
</style></head><body>
<div class="sky"></div>
<div class="halo"></div>
<div class="star" style="left: 40px; top: 60px;"></div>
<div class="star" style="left: 70px; top: 300px; transform: scale(.7);"></div>
<div class="star" style="left: 120px; top: 34px; transform: scale(.6);"></div>
<div class="star" style="left: 30px; top: 190px; transform: scale(.8);"></div>

<div class="bigkoban">
  <div class="eye l"></div><div class="eye r"></div>
  <div class="cheek" style="left: 10px;"></div><div class="cheek" style="left: 104px;"></div>
</div>
<div class="wall"><div class="side"></div><div class="cap"></div></div>
<div class="finger" style="left: 222px; top: 196px; transform: rotate(-8deg);"></div>
<div class="finger" style="left: 224px; top: 222px; transform: rotate(-4deg);"></div>

<div class="spark" style="left: 70px; top: 96px;"></div>
<div class="spark" style="left: 96px; top: 318px; transform: scale(.7);"></div>
<div class="spark violet" style="left: 176px; top: 30px; transform: scale(.6);"></div>
<div class="coin" style="left: 150px; top: 330px; transform: rotate(-12deg);"></div>
</body></html>
