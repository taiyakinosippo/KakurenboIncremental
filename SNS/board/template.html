<title>かせぐんぼ投稿ボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 一列のカード（スマホで上から順に読む）。夜の館：紺のベタ地に小判の金と月の薄紫。下書き 1 本 = 1 枚 */
:root {
  --bg: #f4f1fa; --surface: #ffffff; --ink: #1d1530; --muted: #6b5f86; --line: #ddd5ee;
  --gold: #b9740e; --gold-soft: #fff2d4; --violet: #6a48c2; --done: #2f7d5b;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f0b22; --surface: #1b1538; --ink: #f1ecff; --muted: #a99cd0; --line: #2f2759;
  --gold: #ffcf5a; --gold-soft: #3a2c12; --violet: #c2a6ff; --done: #6fd3a2; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f0b22; --surface: #1b1538; --ink: #f1ecff; --muted: #a99cd0; --line: #2f2759;
  --gold: #ffcf5a; --gold-soft: #3a2c12; --violet: #c2a6ff; --done: #6fd3a2; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 8px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.3; margin: 0; letter-spacing: .02em; }
h1 b { color: var(--gold); font-weight: 400; } h1 i { color: var(--violet); font-style: normal; }
.how { margin: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--muted); font-size: 14px; }
.how ol { margin: 0; padding-left: 1.3em; }
.post { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.post.next { border: 2px solid var(--gold); box-shadow: 0 0 0 4px var(--gold-soft); }
.post.done { opacity: .62; }
.post.todo { border-style: dashed; }
.when { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.when .day { font-family: var(--font-display); color: var(--ink); font-size: 15px; }
.when .series { margin-left: auto; letter-spacing: .04em; }
.next-label { display: none; font-family: var(--font-display); color: var(--gold); font-size: 13px; letter-spacing: .08em; }
.post.next .next-label { display: block; }
h2 { font-size: 17px; line-height: 1.45; margin: 0; text-wrap: balance; }
.badge { margin: 0; color: var(--done); font-weight: 700; font-size: 13px; }
.textbox { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tb-head { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 12px; background: var(--bg); font-size: 13px; color: var(--muted); }
.tb-head .count { font-variant-numeric: tabular-nums; margin-left: auto; }
pre { margin: 0; padding: 12px; white-space: pre-wrap; word-break: break-word; font-family: var(--font-body); font-size: 15px; line-height: 1.75; }
button.copy { font: 700 14px var(--font-body); color: #1d1530; background: var(--gold); border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; min-height: 40px; }
button.copy:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
button.copy.ok { background: var(--done); color: #fff; }
.imgs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
figure { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
figure img { width: 100%; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
figcaption, .note { font-size: 12px; color: var(--muted); margin: 0; word-break: break-all; }
footer { color: var(--muted); font-size: 12px; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main>
  <header>
    <h1><b>かせぐん</b><i>ぼ</i> 投稿ボード</h1>
    <div class="how">
      <ol>
        <li>金色の枠が<strong>次に出す投稿</strong>です</li>
        <li>「コピー」で本文をコピーし、X に貼り付けます</li>
        <li>画像は長押しで保存して、投稿に付けます</li>
        <li>投稿したら URL を Claude に送ると記録します</li>
      </ol>
    </div>
  </header>
<!--CARDS-->
  <footer>平日は 21 時ごろ・土曜は 10〜12 時に出す予定です</footer>
</main>

<script>
(function () {
  var next = document.querySelector('.post:not(.done):not(.todo)');
  if (next) {
    next.classList.add('next');
    var l = document.createElement('div'); l.className = 'next-label'; l.textContent = 'つぎに出す投稿';
    next.insertBefore(l, next.firstChild);
  }
  document.querySelectorAll('button.copy').forEach(function (b) {
    b.addEventListener('click', function () {
      var pre = document.getElementById(b.dataset.target);
      var text = pre.textContent;
      function done(msg) { b.textContent = msg; b.classList.add('ok'); setTimeout(function () { b.textContent = 'コピー'; b.classList.remove('ok'); }, 1800); }
      function select() {
        var r = document.createRange(); r.selectNodeContents(pre);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        done('選択しました');
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done('コピーしました'); }, select);
      } else { select(); }
    });
  });
})();
</script>
